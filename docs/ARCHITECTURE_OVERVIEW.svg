<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">orda-book architecture and event flow</title>
  <desc id="architecture-description">Offline replay and a bounded ingress queue feed typed events into a single-threaded matching engine, which produces trades and book state while three interchangeable storage backends implement the same behavior.</desc>
  <!-- Palette and type are the ones recorded in docs/DESIGN_THEME.md. The
       accent is the page's leaf green and it is the only accent here; the
       numbers, the flow, and the subject of the figure all use it. -->
  <defs>
    <style>
      .canvas { fill: #f7f8f4; }
      .ink { fill: #1b211d; }
      .muted { fill: #536058; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; letter-spacing: -0.022em; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
      .group { fill: #ffffff; stroke: #d9ded7; stroke-width: 1.5; }
      .group-label { fill: #6b726b; font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; letter-spacing: 0.14em; }
      .node { fill: #f7f8f4; stroke: #d9ded7; stroke-width: 1.5; }
      .node-subject { fill: #e9f0e8; stroke: #426849; stroke-width: 2; }
      .node-title { fill: #1b211d; font: 650 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
      .subject-title { fill: #315638; }
      .node-detail { fill: #536058; font: 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
      .rule { fill: none; stroke: #d9ded7; stroke-width: 1; }
      .number { fill: #426849; font: 650 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 0.08em; }
      .flow { fill: none; stroke: #426849; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .flow-alt { fill: none; stroke: #6b726b; stroke-width: 1.8; stroke-dasharray: 6 6; stroke-linecap: round; marker-end: url(#arrow-alt); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#426849" />
    </marker>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b726b" />
    </marker>
  </defs>

  <rect class="canvas" width="1200" height="700" rx="10" />

  <text class="title ink" x="56" y="58">orda-book</text>
  <text class="subtitle muted" x="56" y="86">Typed events in, price-time matching at the center, observable state and trades out.</text>

  <rect class="group" x="42" y="128" width="250" height="468" rx="8" />
  <text class="group-label" x="68" y="162">EVENT SOURCES</text>

  <rect class="node" x="68" y="190" width="198" height="110" rx="6" />
  <text class="number" x="88" y="218">01</text>
  <text class="node-title" x="88" y="246">Event file</text>
  <text class="node-detail" x="88" y="270">Offline replay and</text>
  <text class="node-detail" x="88" y="289">deterministic benchmarks</text>

  <rect class="node" x="68" y="378" width="198" height="110" rx="6" />
  <text class="number" x="88" y="406">02</text>
  <text class="node-title" x="88" y="434">Producer</text>
  <text class="node-detail" x="88" y="458">Typed feed events at the</text>
  <text class="node-detail" x="88" y="477">bounded ingress boundary</text>

  <rect class="group" x="326" y="128" width="250" height="468" rx="8" />
  <text class="group-label" x="352" y="162">INTAKE</text>

  <rect class="node" x="352" y="190" width="198" height="110" rx="6" />
  <text class="number" x="372" y="218">03</text>
  <text class="node-title" x="372" y="246">Event parser</text>
  <text class="node-detail" x="372" y="270">Records split on space</text>
  <text class="node-detail" x="372" y="289">or comma become Event</text>

  <rect class="node" x="352" y="378" width="198" height="110" rx="6" />
  <text class="number" x="372" y="406">04</text>
  <text class="node-title" x="372" y="434">SPSC queue</text>
  <text class="node-detail" x="372" y="458">Bounded handoff that</text>
  <text class="node-detail" x="372" y="477">reports a full queue</text>

  <rect class="group" x="610" y="128" width="320" height="468" rx="8" />
  <text class="group-label" x="636" y="162">MATCHING CORE</text>

  <rect class="node-subject" x="636" y="190" width="268" height="180" rx="6" />
  <text class="number" x="656" y="218">05</text>
  <text class="node-title subject-title" x="656" y="246">Single-threaded engine</text>
  <text class="node-detail" x="656" y="273">Price-time priority</text>
  <text class="node-detail" x="656" y="295">Add, cancel, and modify</text>
  <text class="node-detail" x="656" y="317">Matching, trades, and stats</text>
  <path class="rule" d="M 656 339 H 884" />
  <text class="node-detail" x="656" y="357">One owner mutates book state</text>

  <rect class="node" x="636" y="414" width="268" height="136" rx="6" />
  <text class="number" x="656" y="442">06</text>
  <text class="node-title" x="656" y="470">Storage backends</text>
  <text class="node-detail" x="656" y="495">baseline map + list</text>
  <text class="node-detail" x="656" y="516">pooled order slots</text>
  <text class="node-detail" x="656" y="537">bounded bitmap ladder</text>

  <rect class="group" x="964" y="128" width="194" height="468" rx="8" />
  <text class="group-label" x="990" y="162">OUTPUTS</text>

  <rect class="node" x="990" y="190" width="142" height="110" rx="6" />
  <text class="number" x="1008" y="218">07</text>
  <text class="node-title" x="1008" y="246">Trades</text>
  <text class="node-detail" x="1008" y="270">Matched fills</text>
  <text class="node-detail" x="1008" y="289">and quantities</text>

  <rect class="node" x="990" y="378" width="142" height="110" rx="6" />
  <text class="number" x="1008" y="406">08</text>
  <text class="node-title" x="1008" y="434">Book state</text>
  <text class="node-detail" x="1008" y="458">Snapshots, stats,</text>
  <text class="node-detail" x="1008" y="477">benchmark output</text>

  <path class="flow" d="M 266 245 H 352" />
  <path class="flow" d="M 266 433 H 352" />
  <path class="flow" d="M 550 245 H 636" />
  <path class="flow" d="M 550 433 H 594 V 277 H 636" />
  <path class="flow-alt" d="M 770 364 V 414" />
  <path class="flow" d="M 904 245 H 990" />
  <path class="flow" d="M 904 433 H 990" />

  <text class="subtitle muted" x="56" y="638">Networking, persistence, and concurrent matching remain outside this study.</text>
</svg>
